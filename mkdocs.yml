site_name: Mémoire Émile — Sciences de l'Éducation
site_description: Wiki du mémoire d'Émilie — Assistant de rédaction propulsé par BAVI LEO
site_author: Émile & LEO
repo_url: https://github.com/christophedanhier-hash/emile-wiki
edit_uri: edit/main/docs/

theme:
  name: material
  language: fr
  palette:
    primary: deep purple
    accent: purple
  features:
    - navigation.instant
    - navigation.top
    - search.highlight
    - content.action.edit
    - content.action.view

nav:
  - 🏠 Accueil: index.md
  - 📋 Plan: plan.md
  - 📖 Introduction: introduction.md
  - 🔍 Analyse réflexive: analyse.md
  - 🎯 Hypothèse: hypothese.md
  - 🧠 Cadre théorique: cadre_theorique.md
  - 📚 Bibliographie: bibliographie.md
  - 📝 Notes:
    - Générales: notes.md
    - Historique conversations: notes/historique_conversations.md
  - 📖 Guide utilisateur: guide-utilisateur.md
  - 👨‍🏫 Retours directeur: retours-directeur.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - footnotes
  - toc:
      permalink: true

plugins:
  - search
  - print-site:
      add_to_navigation: true
      print_page_title: 'Imprimer en PDF'
      add_print_site_banner: false
